<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cedar Lane Auto Detailing - Receptionist</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; }
    #log { border: 1px solid #ccc; height: 70vh; overflow-y: auto; padding: 1rem; white-space: pre-wrap; }
    .you { color: #0645ad; } .agent { color: #222; } .err { color: #b00; } .typing { color: #888; font-style: italic; }
    form { display: flex; gap: .5rem; margin-top: .5rem; } input { flex: 1; padding: .5rem; }
  </style>
</head>
<body>
  <h3>Cedar Lane Auto Detailing</h3>
  <div id="log"></div>
  <form id="f"><input id="m" autocomplete="off" placeholder="Type a message..." autofocus /><button>Send</button></form>
  <script>
    const sessionId = crypto.randomUUID();
    const log = document.getElementById("log"), input = document.getElementById("m");
    const add = (cls, who, text) => { const p = document.createElement("p"); p.className = cls; p.textContent = `${who}: ${text}`; log.append(p); log.scrollTop = 1e9; };
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const message = input.value.trim(); if (!message) return;
      input.value = ""; add("you", "You", message);
      const typing = document.createElement("p"); typing.className = "typing"; typing.textContent = "Agent is typing…";
      log.append(typing); log.scrollTop = 1e9; input.disabled = true;
      try {
        const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sessionId, message }) });
        const data = await r.json();
        data.reply !== undefined ? add("agent", "Agent", data.reply) : add("err", "Error", data.error);
      } catch (err) {
        add("err", "Error", err.message);
      } finally {
        typing.remove(); input.disabled = false; input.focus();
      }
    };
  </script>
</body>
</html>
